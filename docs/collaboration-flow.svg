<svg width="680" height="860" viewBox="0 0 680 860" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Flujo de colaboracion en el repo</title>
<desc>Diagrama: cualquier colaborador crea una rama desde main, hace cambios, commitea y sube su rama con push, luego abre un Pull Request. La dueña del proyecto (Vercel) revisa y hace merge en GitHub, lo que dispara el deploy automatico. Despues del merge, ambos borran la rama: primero en GitHub o con git push origin --delete, luego localmente con git branch -d y git fetch --prune. Al final se listan las funciones propias de cada rol: el colaborador sigue el flujo de ramas y borra su propia rama; la dueña ademas revisa y mergea todos los Pull Requests, verifica y destraba deploys, administra el equipo de Vercel y gestiona las variables de entorno y secretos.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="860" fill="#ffffff"/>

<text x="150" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Cualquier colaborador</text>
<text x="530" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Dueña del proyecto (Vercel)</text>

<g>
<rect x="60" y="50" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="150" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">main actualizado</text>
</g>
<line x1="150" y1="94" x2="150" y2="128" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="128" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="150" y="148" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Crear rama</text>
<text x="150" y="166" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" fill="#085041">git checkout -b feature/x</text>
</g>
<line x1="150" y1="184" x2="150" y2="218" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="218" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="150" y="238" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Cambios + commit</text>
<text x="150" y="256" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" fill="#085041">git add . / git commit</text>
</g>
<line x1="150" y1="274" x2="150" y2="308" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="308" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="150" y="328" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Push de su rama</text>
<text x="150" y="346" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" fill="#085041">git push origin feature/x</text>
</g>
<line x1="150" y1="364" x2="150" y2="398" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="398" width="180" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="150" y="420" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Abre Pull Request</text>
</g>

<path d="M240 420 L 400 420" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="400" y="398" width="220" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="510" y="420" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Revisa y da Merge</text>
</g>
<line x1="510" y1="442" x2="510" y2="476" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="400" y="476" width="220" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="510" y="496" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">Deploy automatico</text>
<text x="510" y="514" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#633806">Vercel (autor = dueña)</text>
</g>
<line x1="510" y1="532" x2="510" y2="566" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="400" y="566" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="510" y="588" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Ready en Vercel</text>
</g>

<line x1="510" y1="610" x2="510" y2="634" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="510" y="646" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Borrar rama remota y local</text>

<line x1="40" y1="690" x2="640" y2="690" stroke="#D3D1C7" stroke-width="1"/>
<text x="40" y="716" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="500" fill="#5F5E5A">Funciones por rol</text>

<g>
<rect x="40" y="736" width="280" height="104" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="56" y="756" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">Cualquier colaborador</text>
<text x="56" y="776" text-anchor="start" font-family="sans-serif" font-size="11" fill="#444441">- Rama nueva desde main, nunca reusada</text>
<text x="56" y="794" text-anchor="start" font-family="sans-serif" font-size="11" fill="#444441">- Commit, push y Pull Request</text>
<text x="56" y="812" text-anchor="start" font-family="sans-serif" font-size="11" fill="#444441">- Borra su propia rama tras el merge</text>
</g>

<g>
<rect x="360" y="736" width="280" height="104" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="376" y="756" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="500" fill="#26215C">Dueña del proyecto</text>
<text x="376" y="776" text-anchor="start" font-family="sans-serif" font-size="11" fill="#3C3489">- Revisa y mergea todos los PR</text>
<text x="376" y="794" text-anchor="start" font-family="sans-serif" font-size="11" fill="#3C3489">- Verifica y destraba deploys en Vercel</text>
<text x="376" y="812" text-anchor="start" font-family="sans-serif" font-size="11" fill="#3C3489">- Administra equipo, .env y secretos</text>
</g>
</svg>
